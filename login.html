<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 基因组数据分析系统</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-login">
  <div class="login-wrap">
    <h1>基因组数据分析系统</h1>
    <p class="sub">登录后进入转录组 · 宏基因组 · 16S扩增子 分析工作台</p>

    <form id="login-form" autocomplete="on">
      <label>
        用户名
        <input type="text" id="login-user" name="username" required placeholder="请输入用户名" autocomplete="username" />
      </label>
      <label>
        密码
        <input type="password" id="login-pass" name="password" required placeholder="请输入密码" autocomplete="current-password" />
      </label>
      <label style="display:flex;align-items:center;gap:6px;margin-bottom:10px;">
        <input type="checkbox" id="login-remember" style="width:auto;" />
        <span>记住登录状态</span>
      </label>
      <p class="login-error" id="login-error" hidden></p>
      <button class="btn btn-primary" type="submit">登录</button>
    </form>

    <details style="margin-top:14px;font-size:12px;color:#555;">
      <summary style="cursor:pointer;">没有账号？注册</summary>
      <form id="register-form" style="margin-top:10px;">
        <label>
          用户名
          <input type="text" id="reg-user" required placeholder="设置用户名" />
        </label>
        <label>
          显示名称
          <input type="text" id="reg-name" placeholder="可选" />
        </label>
        <label>
          密码
          <input type="password" id="reg-pass" required placeholder="至少 4 位" />
        </label>
        <p class="login-error" id="reg-error" hidden></p>
        <button class="btn btn-default" type="submit" style="width:100%;margin-top:8px;">创建账号</button>
      </form>
    </details>

  </div>

  <script src="auth.js"></script>
  <script src="login-page.js"></script>
</body>
</html>
