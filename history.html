<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>历史记录 · 基因组数据分析系统</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="auth.js"></script>
</head>
<body class="page-history">
  <header class="site-header">
    <a class="logo" href="index.html">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-text">基因组数据分析系统</span>
    </a>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="16s.html">16S扩增子</a>
      <a href="meta.html">宏基因组</a>
      <a href="rna.html">转录组</a>
      <a href="history.html" class="active">历史记录</a>
    </nav>
    <div class="header-actions">
      <button class="btn btn-default btn-sm" id="btn-logout" type="button">退出</button>
    </div>
  </header>

  <main>
    <section class="hero hero-sub">
      <div class="hero-copy">
        <p class="eyebrow">History</p>
        <p class="brand-signal brand-signal-sm">历史分析记录</p>
      </div>
    </section>

    <section class="history-section">
      <div class="history-toolbar">
        <div class="filter-bar" role="tablist" aria-label="类型筛选">
          <button class="filter-btn active" type="button" data-filter="all">全部</button>
          <button class="filter-btn" type="button" data-filter="16s">16S扩增子</button>
          <button class="filter-btn" type="button" data-filter="meta">宏基因组</button>
          <button class="filter-btn" type="button" data-filter="rna">转录组</button>
        </div>
        <div class="history-actions">
          <input type="search" id="history-search" placeholder="搜索项目 / 备注…" />
          <button class="btn btn-default btn-sm" id="btn-clear-history" type="button">清空全部</button>
        </div>
      </div>
      <p class="history-count" id="history-count"></p>
      <div class="history-list" id="history-list"></div>
      <div class="history-empty" id="history-empty" hidden>暂无历史记录。完成一次分析后会自动出现在这里。</div>
    </section>
  </main>

  <footer class="site-footer">
    <p><a href="index.html">返回首页</a> · 基因组数据分析系统 · 历史记录</p>
  </footer>

  <div class="toast" id="toast" hidden></div>
  <script src="storage.js"></script>
  <script>
    document.getElementById("btn-logout")?.addEventListener("click", () => Auth.logout());
  </script>
  <script src="history-page.js"></script>
</body>
</html>
